site_name: BHMarketer Street Insider FAQ Generator
site_url: https://bhmarketer-street-insider-faq-generator.readthedocs.io/
site_description: Search 35 official Street Insider press release FAQs in plain English and generate the FAQ as Markdown, JSON, FAQPage JSON-LD or HTML.
site_author: BHMarketer.ai
repo_url: https://github.com/bhmarketer-ai/BHMarketer-street-insider-faq-generator
repo_name: bhmarketer-ai/BHMarketer-street-insider-faq-generator
theme:
  name: material
  palette:
    primary: indigo
    accent: deep orange
  features:
    - navigation.sections
    - toc.integrate
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
nav:
  - Home: index.md
