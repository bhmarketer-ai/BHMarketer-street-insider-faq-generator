name: Heartbeat
on:
  schedule:
    - cron: "23 4 */2 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run search benchmarks and update heartbeat
        run: |
          RESULT=$(python - <<'PY'
          import csv, street_insider_faq as si
          rows = list(csv.DictReader(open("dataset/street_insider_search_benchmarks.csv")))
          ok = sum(1 for r in rows if (si.ask(r["query"]) or {}).get("id") == int(r["expected_id"]))
          print(f"{ok}/{len(rows)}")
          PY
          )
          {
            echo "BHMarketer Street Insider FAQ Generator heartbeat"
            echo "Last update: $(date -u +%Y-%m-%d)"
            echo "Search benchmarks passed: $RESULT"
            echo "FAQs in knowledge base: $(python -c 'import street_insider_faq as s; print(len(s.FAQS))')"
          } > heartbeat.txt
          cat heartbeat.txt

      - name: Commit heartbeat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add heartbeat.txt
          git diff --cached --quiet || git commit -m "chore: heartbeat update $(date -u +%Y-%m-%d)"
          git push
